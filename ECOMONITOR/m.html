<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMonitor | Submit Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 sm:p-8">
    <main class="max-w-2xl mx-auto bg-white p-6 sm:p-10 rounded-3xl shadow-lg">
        <h2 class="text-2xl font-black mb-6">Submit Environmental Report</h2>
        <form id="reportForm" class="space-y-4">
            <input type="text" id="location" required placeholder="Location Name/Address" class="w-full p-4 border rounded-xl">
            <select id="category" class="w-full p-4 border rounded-xl bg-white">
                <option value="Waste">♻️ Waste</option>
                <option value="Flooding">🌊 Flooding</option>
                <option value="Sewage">🚰 Sewage</option>
                <option value="Air Pollution">💨 Air Pollution</option>
            </select>
            <textarea id="issue" required placeholder="Describe the issue..." class="w-full p-4 border rounded-xl h-32"></textarea>
            
            <div class="border-2 border-dashed p-4 rounded-xl text-center">
                <input type="file" id="imageFile" accept="image/*" class="text-sm">
            </div>

            <button type="button" onclick="getLocation()" class="text-green-600 font-bold text-sm block">📍 Click to Lock GPS Location</button>
            <span id="gpsStatus" class="text-xs text-blue-600 font-bold hidden">✅ GPS Coordinates Locked!</span>
            
            <input type="hidden" id="lat">
            <input type="hidden" id="lng">
            
            <button type="submit" id="submitBtn" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold hover:bg-green-700 transition">Submit Report</button>
        </form>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBFSIqcnP5U0CMjQZtIS3jK5VTVcHGLPRw",
            projectId: "client-cc4df",
            storageBucket: "client-cc4df.firebasestorage.app",
            messagingSenderId: "600063857476",
            appId: "1:600063857476:web:9abfe8219251f56e67fd11"
        };
        const db = getFirestore(initializeApp(firebaseConfig));
        const IMGBB_API_KEY = "c92716e18fa6b65e124fac58dbfc6751";

        window.getLocation = () => {
            navigator.geolocation.getCurrentPosition((p) => {
                document.getElementById('lat').value = p.coords.latitude;
                document.getElementById('lng').value = p.coords.longitude;
                document.getElementById('gpsStatus').classList.remove('hidden');
            });
        };

        document.getElementById('reportForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Uploading & Submitting...";

            let imageUrl = "";
            const file = document.getElementById('imageFile').files[0];
            if (file) {
                const formData = new FormData();
                formData.append("image", file);
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
                const data = await res.json();
                imageUrl = data.data.url;
            }

            await addDoc(collection(db, "reports"), {
                location: document.getElementById('location').value,
                issue: document.getElementById('issue').value,
                category: document.getElementById('category').value,
                image: imageUrl,
                lat: document.getElementById('lat').value || "0",
                lng: document.getElementById('lng').value || "0",
                status: "Pending",
                createdAt: serverTimestamp()
            });

            alert("Report Submitted!");
            location.reload();
        };
    </script>
</body>
</html>

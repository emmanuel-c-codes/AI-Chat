<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | EcoMonitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .animate-slide-up { animation: slideInUp 0.4s ease-out forwards; }
        @keyframes slideInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50">

    <!-- Top Profile Header Section -->
    <header class="bg-white px-5 pt-6 pb-5 sticky top-0 z-20 shadow-sm border-b border-slate-100 flex justify-between items-center">
        <div>
            <p class="text-[10px] font-black uppercase text-slate-400 tracking-wider">Welcome back</p>
            <h1 id="userName" class="text-xl font-black text-slate-800 tracking-tight">Loading profile...</h1>
        </div>
        <button id="logoutBtn" class="p-2.5 bg-slate-50 hover:bg-red-50 text-slate-400 hover:text-red-500 rounded-xl transition-all border border-slate-100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        </button>
    </header>

    <main class="p-5 space-y-6">
        <!-- Balance Cards Grid -->
        <div class="grid grid-cols-2 gap-4 animate-slide-up">
            <!-- Wallet Balance Card -->
            <div class="bg-slate-900 rounded-2xl p-4 shadow-xl shadow-slate-900/10 relative overflow-hidden text-white">
                <p class="text-[9px] font-black uppercase text-slate-400 tracking-wider">Wallet Balance</p>
                <h3 class="text-2xl font-black mt-1 tracking-tight">₦<span id="walletBalance">0</span></h3>
                <div class="absolute -right-4 -bottom-4 w-16 h-16 bg-white/5 rounded-full blur-xl"></div>
            </div>

            <!-- Eco-Points Card -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 relative overflow-hidden">
                <p class="text-[9px] font-black uppercase text-slate-400 tracking-wider">Eco Points</p>
                <h3 class="text-2xl font-black text-emerald-600 mt-1 tracking-tight"><span id="ecoPoints">0</span> <span class="text-xs font-bold text-slate-400 uppercase">pts</span></h3>
            </div>
        </div>

        <!-- Quick Quick Actions -->
        <div class="animate-slide-up" style="animation-delay: 0.1s;">
            <h2 class="text-[10px] font-black uppercase text-slate-400 tracking-wider mb-3">Quick Utilities</h2>
            <a href="recycle.html" class="flex items-center justify-between p-4 bg-emerald-500 hover:bg-emerald-400 text-slate-900 rounded-2xl shadow-lg shadow-emerald-500/10 transition-all group active:scale-[0.98]">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 bg-white/20 rounded-xl">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.253 8H18"></path></svg>
                    </div>
                    <div>
                        <h4 class="font-black text-sm uppercase tracking-wide">Recycle & Earn Cash</h4>
                        <p class="text-[10px] text-slate-900/70 font-medium">Schedule a quick scrap pickup</p>
                    </div>
                </div>
                <svg class="w-5 h-5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </a>
        </div>

        <!-- Recent Recycling Feed Activity Section -->
        <div class="animate-slide-up" style="animation-delay: 0.2s;">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-[10px] font-black uppercase text-slate-400 tracking-wider">Recent Disposals</h2>
            </div>
            
            <div id="activityFeed" class="space-y-3">
                <!-- Fallback Loading State Indicator -->
                <div class="text-center py-8 text-sm text-slate-400 font-medium bg-white rounded-2xl border border-slate-100">
                    Syncing live records...
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, where, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBFSIqcnP5U0CMjQZtIS3jK5VTVcHGLPRw",
            authDomain: "client-cc4df.firebaseapp.com",
            projectId: "client-cc4df",
            storageBucket: "client-cc4df.firebasestorage.app",
            messagingSenderId: "600063857476",
            appId: "1:600063857476:web:9abfe8219251f56e67fd11"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let unsubscribeUser = null;
        let unsubscribeActivity = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                setupRealtimeListeners(user.uid);
            } else {
                cleanupListeners();
                window.location.href = "login.html";
            }
        });

        function setupRealtimeListeners(userId) {
            // 1. Listen directly to Profile Ledger Document Changes
            unsubscribeUser = onSnapshot(doc(db, "users", userId), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById("userName").innerText = data.fullName || "User Profile";
                    
                    const balance = data.walletBalance || 0;
                    const points = data.ecoPoints || 0;
                    
                    document.getElementById("walletBalance").innerText = balance.toLocaleString();
                    document.getElementById("ecoPoints").innerText = points.toLocaleString();
                } else {
                    document.getElementById("userName").innerText = "Eco Citizen";
                }
            }, (error) => console.error("Profile sync failure:", error));

            // 2. Query structural list entries from "reports" collection
            const reportsRef = collection(db, "reports");
            const activityQuery = query(
                reportsRef, 
                where("userId", "==", userId),
                orderBy("createdAt", "desc")
            );

            unsubscribeActivity = onSnapshot(activityQuery, (querySnapshot) => {
                const feedContainer = document.getElementById("activityFeed");
                
                if (querySnapshot.empty) {
                    feedContainer.innerHTML = `
                        <div class="text-center py-8 text-xs text-slate-400 font-semibold bg-white rounded-2xl border border-slate-100 p-4">
                            No batches logged yet. Your recycling requests will appear here!
                        </div>`;
                    return;
                }

                let htmlContent = "";
                querySnapshot.forEach((doc) => {
                    const record = doc.data();
                    
                    // Assign explicit color themes based on operational status labels
                    let statusBadgeColor = "bg-amber-50 text-amber-700 border-amber-200";
                    if (record.status === "completed") statusBadgeColor = "bg-emerald-50 text-emerald-700 border-emerald-200";
                    if (record.status === "cancelled") statusBadgeColor = "bg-rose-50 text-rose-700 border-rose-200";

                    htmlContent += `
                        <div class="bg-white rounded-xl p-4 border border-slate-100 flex items-center justify-between gap-3 shadow-xs">
                            <div class="flex items-center gap-3">
                                <div class="p-2.5 ${record.category === 'Recycling' ? 'bg-emerald-50 text-emerald-600' : 'bg-blue-50 text-blue-600'} rounded-xl text-sm font-bold">
                                    ♻️
                                </div>
                                <div>
                                    <h4 class="font-bold text-slate-800 text-sm tracking-tight">${record.title || "Recycling Batch"}</h4>
                                    <p class="text-[10px] text-slate-400 font-medium truncate max-w-[160px]">${record.location || "No pickup details"}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="px-2 py-0.5 text-[9px] font-black uppercase rounded-md border ${statusBadgeColor}">
                                    ${record.status || "pending"}
                                </span>
                                ${record.estimatedPayout ? `<p class="text-xs font-black text-slate-700 mt-1">+₦${record.estimatedPayout.toLocaleString()}</p>` : ""}
                            </div>
                        </div>`;
                });
                
                feedContainer.innerHTML = htmlContent;
            }, (error) => {
                console.error("Activity feed query sync error:", error);
                // Graceful fallback for missing index errors during construction phase
                document.getElementById("activityFeed").innerHTML = `
                    <div class="text-center py-6 text-xs text-slate-400 font-medium bg-white rounded-2xl border border-slate-100 p-4">
                        Unable to fetch sorted timeline. Check Firebase Console to ensure an Index is active.
                    </div>`;
            });
        }

        function cleanupListeners() {
            if (unsubscribeUser) unsubscribeUser();
            if (unsubscribeActivity) unsubscribeActivity();
        }

        // Clean user log out routing loop
        document.getElementById("logoutBtn").addEventListener("click", () => {
            if (confirm("Are you sure you want to log out?")) {
                signOut(auth).then(() => window.location.href = "login.html");
            }
        });
    </script>
</body>
</html>

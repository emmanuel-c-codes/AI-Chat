<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - EcoMonitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6">Login</h1>
        <form id="loginForm" class="space-y-4">
            <input type="email" id="email" required placeholder="Email" class="w-full p-2 border rounded">
            <input type="password" id="password" required placeholder="Password" class="w-full p-2 border rounded">
            <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded">Sign In</button>
        </form>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        const app = initializeApp({ apiKey: "AIzaSyBFSIqcnP5U0CMjQZtIS3jK5VTVcHGLPRw", authDomain: "client-cc4df.firebaseapp.com", projectId: "client-cc4df", storageBucket: "client-cc4df.firebasestorage.app", messagingSenderId: "600063857476", appId: "1:600063857476:web:9abfe8219251f56e67fd11" });
        const auth = getAuth(app);
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
                window.location.href = "report.html";
            } catch (err) { alert(err.message); }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SkillProof</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Navigation Bar -->
    <nav class="flex items-center justify-between px-8 py-4 bg-white border-b border-gray-100">
        <div class="flex items-center gap-2">
            <!-- If you have an image, replace this div with: <img src="logo.png" class="h-8"> -->
            <div class="font-bold text-xl text-emerald-600">SkillProof</div>
        </div>
        <div class="flex items-center gap-6 text-sm font-medium text-gray-600">
            <a href="#" class="hover:text-emerald-600">Home</a>
            <a href="login.html" class="hover:text-emerald-600">Login</a>
            <a href="signup.html" class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 transition">Sign Up</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex flex-col items-center justify-center py-12 px-4">
        
        <!-- Branding Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">SkillProof</h1>
            <p class="text-gray-500 mt-1">Start your career readiness journey</p>
        </div>

        <!-- Your Original Form Div -->
        <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-200 w-full max-w-md">
            <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">Create your account</h1>
            
            <div id="feedback" class="hidden fade-in text-sm p-3 rounded-lg mb-4 text-center font-medium"></div>

            <form id="signupForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Full Name</label>
                    <input type="text" id="name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="email" required placeholder="you@example.com" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" required placeholder="Min. 6 characters" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-semibold hover:bg-emerald-700 transition">
                    Sign Up →
                </button>
            </form>

            <div class="relative my-6"><div class="absolute inset-0 flex items-center"><div class="w-full border-t"></div></div><div class="relative flex justify-center text-sm"><span class="bg-white px-2 text-gray-500">OR</span></div></div>

            <button id="googleBtn" class="w-full border py-2.5 rounded-lg font-medium flex items-center justify-center gap-2 hover:bg-gray-50 transition">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 6.58c1.59 0 3.02.55 4.14 1.62l3.12-3.12C17.46 3.07 14.97 2 12 2 7.7 2 3.99 4.47 2.18 7.07l3.66 2.83c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continue with Google
            </button>

            <p class="text-center text-sm text-gray-600 mt-6">
                Already have an account? <a href="login.html" class="text-emerald-600 font-semibold hover:underline">Sign in</a>
            </p>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBFSIqcnP5U0CMjQZtIS3jK5VTVcHGLPRw",
            authDomain: "client-cc4df.firebaseapp.com",
            projectId: "client-cc4df",
            storageBucket: "client-cc4df.firebasestorage.app",
            messagingSenderId: "600063857476",
            appId: "1:600063857476:web:9abfe8219251f56e67fd11",
            measurementId: "G-MNM99NCKH9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("User is logged in.");
            }
        });

        const feedback = document.getElementById('feedback');
        function showFeedback(message, isError = true) {
            feedback.textContent = message;
            feedback.className = `fade-in text-sm p-3 rounded-lg mb-4 text-center font-medium ${isError ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}`;
            feedback.classList.remove('hidden');
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                showFeedback("Account created successfully! Redirecting...", false);
                setTimeout(() => window.location.href = "dashboard.html", 2000);
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') {
                    showFeedback("This email is already in use. Please sign in instead.");
                } else {
                    showFeedback("Error: " + error.message);
                }
            }
        });

        document.getElementById('googleBtn').addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                showFeedback("Signed in successfully! Redirecting...", false);
                setTimeout(() => window.location.href = "dashboard.html", 2000);
            } catch (error) {
                showFeedback("Google sign-in failed. Please try again.");
            }
        });
    </script>
</body>
</html>

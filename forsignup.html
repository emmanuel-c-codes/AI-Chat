<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SkillProof</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* Professional drop-in animation */
        @keyframes slide-down {
            0% { transform: translateY(-50px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .animate-drop-in {
            animation: slide-down 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
    </style>
</head>
<body class="bg-gray-50">

    <nav class="sticky top-0 z-50 bg-white/70 backdrop-blur-md border-b border-gray-100 flex items-center justify-between px-4 md:px-8 py-4">
        <div class="flex items-center gap-2">
            <img src="https://api.iconify.design/lucide:shield-check.svg?color=%23059669" class="w-8 h-8">
            <span class="font-bold text-lg md:text-xl text-emerald-600">SkillProof</span>
        </div>
        <div class="flex items-center gap-3 md:gap-6 text-xs md:text-sm font-medium text-gray-600">
            <a href="#" class="hover:text-emerald-600">Home</a>
            <a href="login.html" class="hover:text-emerald-600">Login</a>
            <a href="signup.html" class="bg-emerald-600 text-white px-3 md:px-4 py-2 rounded-lg">Sign Up</a>
        </div>
    </nav>

    <main class="flex flex-col items-center justify-center min-h-[80vh] px-4 py-8">
        <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-100 w-full max-w-md animate-drop-in">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-gray-900">Create your Account</h1>
                <p class="text-gray-500">Start your career readiness journey</p>
            </div>

            <div id="feedback" class="hidden text-sm p-3 rounded-lg mb-4 text-center font-medium"></div>

            <form id="signupForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Full Name</label>
                    <input type="text" id="name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-semibold">Sign Up</button>
            </form>

            <p class="text-center text-sm text-gray-600 mt-6">Already a member? <a href="login.html" class="text-emerald-600 font-semibold">Login</a></p>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBFSIqcnP5U0CMjQZtIS3jK5VTVcHGLPRw",
            authDomain: "client-cc4df.firebaseapp.com",
            projectId: "client-cc4df",
            storageBucket: "client-cc4df.firebasestorage.app",
            messagingSenderId: "600063857476",
            appId: "1:600063857476:web:9abfe8219251f56e67fd11"
        };
        const auth = getAuth(initializeApp(firebaseConfig));
        
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            alert("Account creation logic triggered.");
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Gratitude</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

    <div class="w-full max-w-sm mx-auto bg-white rounded-2xl shadow-xl p-6">
        <h1 class="text-xl font-bold text-gray-800 mb-6">Daily Gratitude</h1>
        
        <div class="space-y-4">
            <textarea id="gratitude" class="w-full p-3 border border-gray-300 rounded-lg outline-none" rows="3" placeholder="I am grateful for..."></textarea>
            <input type="text" id="win" class="w-full p-3 border border-gray-300 rounded-lg outline-none" placeholder="My daily win was...">
            <button onclick="window.saveEntry()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">
                Save Entry
            </button>
        </div>
        <p id="status" class="text-center text-sm mt-4 text-green-600 font-medium hidden">Entry Saved!</p>
    </div>

    <!-- History Section -->
    <div class="w-full max-w-sm mx-auto mt-8">
        <h2 class="text-lg font-bold text-gray-700 mb-4">Past Entries</h2>
        <div id="entries-list" class="space-y-3"></div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
